name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The live E2E needs the provider credential, so it only runs after a merge
  # to dev (trusted code) or on a manual dispatch. It never runs on a PR.
  push:
    branches: [dev]
  workflow_dispatch:

# Rapid pushes cancel the in-flight run so only the latest state is tested.
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, secret-free checks. This runs for every PR, including drafts and
  # forks, because it only needs the read-only GITHUB_TOKEN.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

  # Hermetic Telegram regression suite. It talks to the in-process Bot API
  # emulator over HTTP, so it needs no bot token, network, or OpenCode service
  # and runs for every PR, including forks and drafts.
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Telegram emulator suite
        run: go test -race -count=1 -v -run EmulatedTelegram ./internal/comm/telegram/... ./internal/daemon/

  # Live end-to-end check. It runs only on a push to dev or a manual dispatch,
  # never on a PR: the provider credential is available to the service process
  # and the test code runs on the same runner, so exposing it to PR-controlled
  # code would let that code inspect the service environment.
  e2e:
    needs: unit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Hard cap. The suite allows at most four turns (three live turns plus one
    # zero-cost failure case); anything slower than 15 minutes fails the check.
    timeout-minutes: 15
    environment: OPENCODE_GO_API_KEY
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install OpenCode CLI
        # Pin the CLI to the version the V2 client contract is tested against.
        run: |
          npm install --global @opencode/cli@2.2.6
          opencode --version

      # The key is scoped to this step only: the background service inherits
      # it when it starts from this shell, and the test step below never sees
      # the secret. The managed service also writes ~/.config/opencode/service.json,
      # which is exactly what Acolyte's Ensure path reads.
      - name: Start OpenCode service
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          opencode service start
          for attempt in $(seq 1 30); do
            if opencode api get /api/info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          opencode api get /api/info

      - name: Run live E2E (max 4 turns)
        env:
          ACOLYTE_E2E: "1"
          ACOLYTE_E2E_MODEL: opencode-go/gpt-6-luna
        run: go test -tags=e2e ./e2e/... -v -count=1

      - name: Collect OpenCode logs
        if: failure()
        run: |
          mkdir -p opencode-logs
          cp -R "$HOME/.local/share/opencode/log" opencode-logs/ 2>/dev/null || true
          cp -R "$HOME/.local/state/opencode/log" opencode-logs/ 2>/dev/null || true

      - name: Upload OpenCode logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencode-e2e-logs
          path: opencode-logs
          if-no-files-found: ignore
